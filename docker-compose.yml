services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_OPTIONS: --dns-result-order=ipv4first
      NEXT_PUBLIC_BASE_URL: "https://buga.games"
    expose:
      - "3000"
    labels:
      traefik.enable: "true"

      # HTTPS router (buga.games + www.buga.games)
      traefik.http.routers.buga-landing.rule: "Host(`buga.games`) || Host(`www.buga.games`)"
      traefik.http.routers.buga-landing.entrypoints: "websecure"
      traefik.http.routers.buga-landing.tls: "true"
      traefik.http.routers.buga-landing.tls.certresolver: "letsencrypt"

      # HTTP router - redirects to HTTPS
      traefik.http.routers.buga-landing-web.rule: "Host(`buga.games`) || Host(`www.buga.games`)"
      traefik.http.routers.buga-landing-web.entrypoints: "web"
      traefik.http.routers.buga-landing-web.middlewares: "buga-landing-https-redirect"

      # HTTPS redirect middleware
      traefik.http.middlewares.buga-landing-https-redirect.redirectscheme.scheme: "https"
      traefik.http.middlewares.buga-landing-https-redirect.redirectscheme.permanent: "true"

      # Load balancer
      traefik.http.services.buga-landing.loadbalancer.server.port: "3000"

    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s        # ← increase from 5s to 10s
      retries: 5
      start_period: 60s   # ← increase from 30s to 60s
    init: true
    stop_grace_period: 20s
    restart: unless-stopped
